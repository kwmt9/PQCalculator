name: github pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@v2

      # Install .NET Core SDK
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: 6.0.x
      # change base href
      - name: Fix base href
        run: sed -i 's|<base href="./" />|<base href="/PQCalculator/" />|g' PQCalculator/wwwroot/index.html
      # copy 404.html
      - name: Create 404.html
        run: cp PQCalculator/wwwroot/index.html PQCalculator/wwwroot/404.html

      # Publish the site
      - name: Publish
        run: dotnet publish PQCalculator/PQCalculator.csproj -p:GHPages=true -c:Release -o:public

      # Deploy the site
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public/wwwroot
          force_orphan: true
